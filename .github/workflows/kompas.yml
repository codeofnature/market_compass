name: market_compass

on:
  schedule:
    - cron: "0 6 8 * *"   # 8. dnia miesiąca o 6:00 UTC, po raporcie z rynku pracy USA (1. piątek)
  workflow_dispatch:       # przycisk "Run workflow" do ręcznego uruchomienia

permissions:
  contents: write          # pozwala zapisać wyniki z powrotem do repozytorium

jobs:
  kompas:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v6

      - name: Instalacja Pythona
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalacja bibliotek
        run: pip install pandas

      - name: Uruchomienie kompasu
        run: python kompas_rynku.py

      - name: Przygotowanie strony
        run: |
          mkdir -p docs
          cp kompas_wyniki/kompas_najnowszy.html docs/index.html

      - name: Zapis wyników w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kompas_wyniki docs
          git diff --cached --quiet || git commit -m "Kompas $(date +%Y-%m-%d)"
          git push
